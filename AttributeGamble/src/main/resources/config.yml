# ======================================================================
# AttributeGamble config
# ======================================================================

# Auto-gamble players who join the server for the first time.
gamble-on-first-join: true

# Open the stats menu automatically when a new player first joins.
menu-on-first-join: true

# Slot-machine / roulette animation when stats are rolled:
#  - a full roll (first join) spins every stat and stops them one by one
#  - a single-stat reroll shows one reel that slows down onto the result
# The result is decided before the animation, it only reveals it.
animation:
  enabled: true
  admin-rerolls: true   # also play it for the player when an operator rerolls them

# Attack knockback and oxygen bonus can't go below 0 in vanilla, so negative
# rolls are emulated by the plugin:
#  - negative attack knockback: your melee hits push enemies back less
#    (cut = |roll| * knockback-cut-per-point, e.g. -1.0 -> 50% less)
#  - negative oxygen bonus: you lose air faster underwater
#    (extra air loss per 2 ticks = |roll| * oxygen-drain-per-point, -2 -> twice as fast)
negative-stats:
  knockback-cut-per-point: 0.5
  oxygen-drain-per-point: 1.0

# --- Balance -----------------------------------------------------------
# Every stat has exactly 5 possible rolls ("levels", see the stats section),
# evenly spaced (same gap between each level). The MIDDLE level is the standard
# (vanilla) value, so an "Average" roll is a normal stat - no built-in buffs.
# Within a group, the plugin only allows combinations whose weighted product
# stays within 1.00 +/- tolerance, so a great roll is paid for elsewhere.
# Good-low stats (gravity, fall damage, burning time) count inverted.
# NOTE: with only 5 levels per stat, a very small tolerance leaves few valid
# combinations (more repeats). Raise it for more variety.
groups:
  combat:
    tolerance: 0.05     # +/-5%
  mobility:
    tolerance: 0.15     # +/-15%
  utility:
    tolerance: 0.10     # +/-10%

# "Pity": if the stats rolled so far came out poor, later stats and the choice
# of combination are skewed towards better results. 0 = off.
pity-strength: 2.0

# --- Fun ---------------------------------------------------------------
# Jackpot: a small chance that one stat rolls ONE STEP BEYOND its best level
# (higher than any normal roll). The rest of its group has to pay for it
# (it is skipped if the group cannot afford it).
jackpot:
  enabled: true
  chance: 0.03          # 3% per full roll
  broadcast: true

# Archetype titles ("Tank", "Glass Cannon", "Giant Sprinter" ...), coloured.
titles:
  tab-list: true
  chat-prefix: true
  # Only the main combat + mobility stats can earn a title, and only when that
  # stat is clearly strong. Higher = harder to earn (0.15 is roughly "Good" level).
  min-strength: 0.15

# Anyone can reroll a single stat: shift-click it in /gamble (or /gamble roll <stat>).
# They see the new result and can keep or revert it. Reverting still uses up
# the roll and the XP. Remove the gamble.roll permission to turn it off per player.
player-reroll:
  enabled: true
  xp-levels: 100
  daily-limit: 3        # 0 = unlimited
  decision-seconds: 10

# Roguelike mode: reroll on death. mode: one (random stat) or all.
reroll-on-death:
  enabled: false
  mode: one

# Reroll everything every N in-game days (checked once a minute).
periodic-reroll:
  enabled: false
  days: 3

# --- Compensation rules ------------------------------------------------
# Block interaction range = entity reach + random bonus. Vanilla gap is 1.5
# (3.0 -> 4.5), so the bonus averages 1.5. If entity reach is above normal (3.0)
# the bonus is multiplied by above-normal-multiplier (0.5 -> bonus 0.5 to 1.0).
block-reach-bonus:
  min: 1.0
  max: 2.0
  above-normal-multiplier: 0.5

# If max health rolls below the threshold, one of these stats gets a random
# bonus between min and max (0.10 = +10%). For attack_knockback the bonus is
# converted using that stat's "unit".
low-health-bonus:
  threshold: 0.85
  min: 0.10
  max: 0.20
  stats: [attack_knockback, attack_speed]

# If scale is above 1.0, movement speed gets a bonus on top of its roll.
scale-speed-bonus:
  speed-at-or-below-normal: 0.10
  speed-above-normal: 0.05

# Scale costs/benefits so small is not simply better:
#  - scale above 1.0: knockback resistance += (scale-1) * value
#  - scale below 1.0: max health -= (1-scale) * value  (0.4 -> -10% at scale 0.75)
scale-tradeoffs:
  knockback-resistance-per-scale: 0.8
  small-health-penalty-per-scale: 0.4
  giant-health-bonus: 0.20      # Giant (largest scale level): +20% max health

# --- Movement ----------------------------------------------------------
# With a jump boost (jump strength above normal), fall damage only starts after
# your jump height + this many blocks (a better safe_fall_distance roll still counts).
jump-safe-fall:
  extra-blocks: 3.0

# If the rolled jump can't clear this many blocks, step_height is raised to 1.0
# (not while sneaking).
min-jump-height: 1.05

# Players with such a weak jump can still build up: sneak, look down and
# right-click with a solid block (it is placed under you and you step up).
pillar-assist:
  enabled: true
  cooldown-ms: 250

# --- Stats -------------------------------------------------------------
# levels: the 5 possible rolls, lowest to highest (rounded numbers).
#   MULT stats: multipliers of normal (1.0 = normal)
#   entity_interaction_range: absolute values (normal = 3.0)
#   ADD stats (attack_knockback, oxygen_bonus): added to normal (negatives are emulated, see negative-stats)
# good: high | low | neutral   (neutral = ignored by balance and pity)
# weight: how much this stat counts in its group's balance (reach counts double).
# unit (ADD stats with a base of 0): amount that counts as +100% in the balance maths.
# block_interaction_range is not rolled: it follows entity_interaction_range.
# Attributes missing on your server version are skipped automatically.
stats:
  # combat
  entity_interaction_range: { levels: [2.0, 2.5, 3.0, 3.5, 4.0], good: high, weight: 2.0 }
  attack_speed:             { levels: [0.6, 0.8, 1.0, 1.2, 1.4], good: high }
  attack_knockback:         { levels: [-1.0, -0.5, 0.0, 0.5, 1.0], good: high, unit: 4.0 }   # negatives are emulated
  max_health:               { levels: [0.6, 0.8, 1.0, 1.2, 1.4], good: high }

  # mobility
  gravity:                  { levels: [0.5, 0.75, 1.0, 1.25, 1.5], good: low }
  jump_strength:            { levels: [0.5, 0.75, 1.0, 1.25, 1.5], good: high }
  movement_speed:           { levels: [0.6, 0.8, 1.0, 1.2, 1.4], good: high }
  # Smallest scale 0.6: sneaking height 1.5 * 0.6 = 0.9, so a Tiny player fits under a 1-block gap.
  # "Tiny" / "Giant" titles are only given for the smallest / largest level.
  scale:                    { levels: [0.6, 0.8, 1.0, 1.2, 1.4], good: neutral }

  # utility quirks
  safe_fall_distance:       { levels: [0.5, 0.75, 1.0, 1.25, 1.5], good: high }
  fall_damage_multiplier:   { levels: [0.5, 0.75, 1.0, 1.25, 1.5], good: low }
  burning_time:             { levels: [0.5, 0.75, 1.0, 1.25, 1.5], good: low }
  sneaking_speed:           { levels: [0.6, 0.8, 1.0, 1.2, 1.4], good: high }

  # independent
  block_break_speed:         { levels: [0.5, 0.75, 1.0, 1.25, 1.5], good: high }
  oxygen_bonus:              { levels: [-2.0, -1.0, 0.0, 1.0, 2.0], good: high }              # negatives are emulated
  # replaces water_movement_efficiency, which can't be rolled below vanilla
  submerged_mining_speed:    { levels: [0.5, 0.75, 1.0, 1.25, 1.5], good: high }
