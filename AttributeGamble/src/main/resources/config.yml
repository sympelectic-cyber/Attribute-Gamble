# ======================================================================
# AttributeGamble config
# ======================================================================

# Auto-gamble players who join the server for the first time.
gamble-on-first-join: true

# --- Balance -----------------------------------------------------------
# Stats are balanced in groups. Within a group the stats' multipliers (weighted
# by "weight") multiply to 1.00 +/- tolerance, so a lucky stat is paid for by
# others. Good-low stats (gravity, fall damage, burning time) count inverted.
groups:
  combat:
    tolerance: 0.05     # +/-5%
  mobility:
    tolerance: 0.15     # +/-15%
  utility:
    tolerance: 0.10     # +/-10%

# "Pity": if the stats rolled so far are low on the good side, later stats and
# the net of each group are skewed towards better rolls. 0 = off.
pity-strength: 2.0

# --- Fun ---------------------------------------------------------------
# Jackpot: a small chance that one stat rolls its best possible value. The
# balance step automatically makes the other stats in its group pay for it.
jackpot:
  enabled: true
  chance: 0.03          # 3% per full roll
  broadcast: true

# Archetype titles ("Tank", "Glass Cannon", "Giant Sprinter" ...) shown in
# /gamble and in the tab list.
titles:
  tab-list: true

# Players can reroll a single stat themselves: /gamble roll <stat>
# They see the new result and can /gamble keep or /gamble revert (clickable).
# Reverting still uses up the roll and the XP.
player-reroll:
  enabled: true
  xp-levels: 5
  daily-limit: 3        # 0 = unlimited
  decision-seconds: 10

# Roguelike mode: reroll on death. mode: one (random stat) or all.
reroll-on-death:
  enabled: false
  mode: one

# Reroll everything every N in-game days (checked once a minute).
periodic-reroll:
  enabled: false
  days: 3

# --- Compensation rules ------------------------------------------------
# Block interaction range = entity reach + random bonus. If entity reach is
# above normal (3.0) the bonus is multiplied by above-normal-multiplier.
block-reach-bonus:
  min: 0.5
  max: 1.0
  above-normal-multiplier: 0.5

# If max health rolls below the threshold, one of these stats gets a random
# bonus between min and max (0.10 = +10%).
low-health-bonus:
  threshold: 0.8
  min: 0.10
  max: 0.20
  stats: [attack_damage, attack_speed]

# If scale is above 1.0, movement speed gets a bonus on top of its roll.
scale-speed-bonus:
  speed-at-or-below-normal: 0.10
  speed-above-normal: 0.05

# Scale costs/benefits so small is not simply better:
#  - scale above 1.0: knockback resistance += (scale-1) * value
#  - scale below 1.0: max health -= (1-scale) * value  (0.4 -> -10% at scale 0.75)
scale-tradeoffs:
  knockback-resistance-per-scale: 0.8
  small-health-penalty-per-scale: 0.4

# --- Movement ----------------------------------------------------------
# If the rolled jump can't clear this many blocks, step_height is raised to 1.0.
min-jump-height: 1.05

# Players with such a weak jump can still build up: sneak, look down and
# right-click with a solid block (it is placed under you and you step up).
pillar-assist:
  enabled: true
  cooldown-ms: 250

# --- Friction ----------------------------------------------------------
# friction_modifier scales ground friction: higher = you top out slower (snappy,
# grippy), lower = you slide. The plugin assumes the modifier scales the speed
# lost each tick and corrects movement speed so a speed roll still feels like a buff.
#   high-friction: 1.0 = fully cancel the top speed lost to high friction
#   low-friction : 0.5 = remove half of the free speed from sliding
# Raise/lower these if it feels too strong or too weak in play. (The formula is
# a model - I could not test it in-game - so tune these by feel.)
friction-compensation:
  high-friction: 1.0
  low-friction: 0.5

# Open the stats menu automatically when a new player first joins.
menu-on-first-join: true

# --- Stat ranges -------------------------------------------------------
# kind MULT: min/max are multipliers of normal (1.0 = normal)
# entity_interaction_range: ABSOLUTE values (normal = 3.0)
# kind ADD : min/max are added to normal (oxygen, water efficiency, mining efficiency)
# good: high | low | center | neutral
#   center  = best at normal; counts for pity but not group balance
#   neutral = ignored by balance and pity
# weight: how much one point of this stat counts in the group balance.
#   Reach is worth more than most, so it counts double by default.
# Attributes missing on your server version (e.g. friction_modifier before 26.2)
# are skipped automatically.
stats:
  # combat
  entity_interaction_range: { min: 3.0, max: 5.0, good: high, weight: 2.0 }
  attack_speed:             { min: 0.6, max: 1.5, good: high }
  attack_damage:            { min: 0.6, max: 1.5, good: high }
  max_health:               { min: 0.6, max: 1.5, good: high }

  # mobility
  gravity:                  { min: 0.4,  max: 1.6, good: low }
  jump_strength:            { min: 0.3,  max: 1.8, good: high }
  movement_speed:           { min: 0.6,  max: 1.5, good: high }
  friction_modifier:        { min: 0.8,  max: 1.2, good: center }
  scale:                    { min: 0.75, max: 1.25, good: neutral }

  # utility quirks
  safe_fall_distance:       { min: 0.5, max: 2.0, good: high }
  fall_damage_multiplier:   { min: 0.5, max: 1.5, good: low }
  burning_time:             { min: 0.5, max: 1.5, good: low }
  sneaking_speed:           { min: 0.6, max: 1.5, good: high }

  # independent
  mining_efficiency:         { min: 0.0, max: 1.5, good: high }
  oxygen_bonus:              { min: 0.0, max: 5.0, good: high }
  water_movement_efficiency: { min: 0.0, max: 1.0, good: high }   # vanilla caps this at 1.0
