name: Build plugin
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: mvn -B package -f "$(find . -name pom.xml -not -path '*/target/*' | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: AttributeGamble-jar
          path: "**/target/AttributeGamble-3.0.0.jar"
